name: Build A2HHook Module

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NDK_VERSION: "r26d"
  API_LEVEL: 31

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 unzip

      - name: Setup Android NDK
        run: |
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/${NDK_ZIP}"
          wget -q -O "$NDK_ZIP" "$NDK_URL"
          unzip -q "$NDK_ZIP"
          mv "android-ndk-${NDK_VERSION}" "$HOME/android-ndk"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          bash ./build.sh ci
          VERSION="$(sed -n 's/^version=//p' module.prop | head -n 1)"
          VERSION_CODE="$(sed -n 's/^versionCode=//p' module.prop | head -n 1)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$VERSION"
          fi
          ZIP_NAME="a2h_hook_${VERSION}.zip"
          test -f "$ZIP_NAME"
          unzip -t "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "MODULE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MODULE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Run source and package regressions
        run: |
          node --version
          python3 tests/static_regression.py --ndk "$ANDROID_NDK_HOME"
          python3 tests/verify_module_zip.py "$ZIP_NAME" \
            --expected-version "$MODULE_VERSION" \
            --expected-code "$MODULE_VERSION_CODE"

      - name: Upload module ZIP
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload native binaries
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: a2h_native_arm64-v8a
          path: |
            bin/a2h_apply
            bin/a2h_patch
            bin/a2h_trigger
          retention-days: 30
