<script>
(function(){
  'use strict';
  const OFFICIAL=['com.kugou.android','com.tencent.qqmusic','com.netease.cloudmusic','cn.kuwo.player','com.miui.player','com.luna.music'];
  const DEFAULTS=OFFICIAL.concat(['','','','']);
  const LABELS=['酷狗音乐','QQ音乐','网易云音乐','酷我音乐','小米音乐','Luna音乐','自定义 1','自定义 2','自定义 3','自定义 4'];
  const STORAGE_KEY='a2h_config_v6';
  const LEGACY_STORAGE_KEYS=['a2h_config_v5','a2h_config_v4'];
  const DEVICE_MARKERS={state:'__A2H_DEVICE_STATE__',policy:'__A2H_GAME_AUTO_PAUSE__',packages:'__A2H_DEVICE_PACKAGES__',states:'__A2H_DEVICE_STATES__',end:'__A2H_DEVICE_END__'};
  let mode='whitelist';
  let gameAutoPause='enabled';
  let slots=DEFAULTS.slice();
  let slotEnabled=[true,true,true,true,true,true,false,false,false,false];
  let configRevision=0;
  let deviceConfigReady=false;
  let deviceConfigStatus='loading';
  let applyPending=false;
  let packageWritePending=false;
  let applyBusy=false;
  let interactionBusy=false;
  let applyDrainScheduled=false;
  let applyReason='';
  let lastAppliedKey='';
  let toastTimer=0;
  let toastDismissTimer=0;
  let execSerial=0;
  let strongHaptic=true;
  let activeRoute='main';
  let routeTimer=0;
  let commandReturnFocus=null;
  let lastRootHapticAt=0;
  let pendingRootHaptic='';
  let rootHapticTimer=0;
  let motionPausedUntil=0;
  let motionResumeTimer=0;
  const routeReturnFocus={};
  const $=id=>document.getElementById(id);
  const ROUTES={about:'aboutPage',donate:'donatePage',qr:'qrPage'};
  const FOCUSABLE='button:not([disabled]),a[href],input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])';
  const DONATIONS={
    'wechat-pay':{src:'donate-wechat-pay.webp',alt:'微信支付赞赏码',title:'微信支付'},
    wechat:{src:'donate-wechat.webp',alt:'微信赞赏码',title:'微信赞赏'},
    alipay:{src:'donate-alipay.webp',alt:'支付宝赞赏码',title:'支付宝'}
  };

  function readHapticPreference(){
    try{
      const saved=localStorage.getItem('a2h_haptic_strong');
      if(saved!==null) strongHaptic=saved==='1';
    }catch(error){}
  }
  function haptic(kind){
    if(!strongHaptic) return;
    try{
      if(window.ksu&&typeof window.ksu.haptic==='function'){
        window.ksu.haptic(String(kind||'button'),3);
        return;
      }
    }catch(error){}
    if(findExecBridge()){
      const now=Date.now();
      if(now-lastRootHapticAt<45) return;
      lastRootHapticAt=now;
      pendingRootHaptic=String(kind||'button');
      if(rootHapticTimer) clearTimeout(rootHapticTimer);
      rootHapticTimer=setTimeout(flushRootHaptic,90);
      return;
    }
    try{
      if(navigator.vibrate){
        const base=kind==='error'?[12,35,18]:kind==='confirm'?[18,22,28]:kind==='tick'?[7]:[14];
        navigator.vibrate(base);
      }
    }catch(error){}
  }
  function flushRootHaptic(){
    if(rootHapticTimer) clearTimeout(rootHapticTimer);
    rootHapticTimer=0;
    const kind=pendingRootHaptic;
    pendingRootHaptic='';
    if(kind) execRoot(buildHapticCommand(kind),2500).catch(()=>{});
  }
  function setStrongHaptic(enabled,preview){
    if(preview&&strongHaptic&&!enabled) haptic('toggle');
    strongHaptic=Boolean(enabled);
    $('strongHaptic').checked=strongHaptic;
    try{localStorage.setItem('a2h_haptic_strong',strongHaptic?'1':'0');}catch(error){}
    if(preview&&strongHaptic) haptic('confirm');
  }
  function syncSystemBars(){
    const dark=document.documentElement.dataset.theme==='dark';
    const themeColor=document.getElementById('themeColor');
    if(themeColor) themeColor.content=dark?'#000000':'#f7f7f7';
    try{
      if(window.ksu&&typeof window.ksu.setSystemBarsDark==='function'){
        window.ksu.setSystemBarsDark(dark);
      }
    }catch(error){}
  }
  function enableImmersiveLayout(){
    try{
      if(window.ksu&&typeof window.ksu.enableEdgeToEdge==='function'){
        window.ksu.enableEdgeToEdge(true);
        return;
      }
    }catch(error){}
    try{
      if(window.ksu&&typeof window.ksu.enableInsets==='function') window.ksu.enableInsets(true);
    }catch(error){}
  }
  window.A2HSystemInsets=(top,right,bottom,left)=>{
    const values=[top,right,bottom,left].map(value=>{
      const number=Number(value);
      return Number.isFinite(number)?Math.max(0,Math.round(number)):0;
    });
    const style=document.documentElement.style;
    style.setProperty('--a2h-native-safe-top',values[0]+'px');
    style.setProperty('--a2h-native-safe-right',values[1]+'px');
    style.setProperty('--a2h-native-safe-bottom',values[2]+'px');
    style.setProperty('--a2h-native-safe-left',values[3]+'px');
    syncViewport();
  };
  function renderThemeIcon(){
    const mode=document.documentElement.dataset.themeMode||'system';
    const dark=document.documentElement.dataset.theme==='dark';
    $('theme').setAttribute('aria-pressed',dark?'true':'false');
    const nextLabel=mode==='system'?(dark?'切换到浅色模式':'切换到深色模式'):(mode==='light'?'切换到深色模式':'改为跟随系统主题');
    const label=(mode==='system'?'当前跟随系统，':'当前'+(dark?'深色':'浅色')+'模式，')+nextLabel;
    $('theme').setAttribute('aria-label',label);
    $('theme').title=label;
    $('theme').innerHTML=mode==='system'?
      '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>':(dark?
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.4 8.4 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2z"/></svg>':
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M3 12h2M19 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/><circle cx="12" cy="12" r="4"/></svg>');
  }
  function applyThemeMode(mode,persist){
    const root=document.documentElement;
    const normalized=mode==='light'||mode==='dark'?mode:'system';
    const systemDark=typeof window.__A2H_NATIVE_DARK__==='boolean'?window.__A2H_NATIVE_DARK__:Boolean(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.dataset.themeMode=normalized;
    root.dataset.theme=normalized==='system'?(systemDark?'dark':'light'):normalized;
    if(persist){
      try{
        if(normalized==='system') localStorage.removeItem('a2h_theme');
        else localStorage.setItem('a2h_theme',normalized);
      }catch(error){}
    }
    renderThemeIcon();
    syncSystemBars();
  }
  function isTextEntry(element){
    if(!element) return false;
    if(element.isContentEditable) return true;
    if(element.tagName==='TEXTAREA') return true;
    if(element.tagName!=='INPUT') return false;
    return !['button','checkbox','color','file','hidden','image','radio','range','reset','submit'].includes(element.type);
  }
  function scrollActiveEntry(){
    const active=document.activeElement;
    if(!isTextEntry(active)) return;
    setTimeout(()=>{
      if(document.activeElement===active&&typeof active.scrollIntoView==='function'){
        active.scrollIntoView({block:'center',inline:'nearest',behavior:'smooth'});
      }
    },80);
  }
  function syncViewport(){
    const viewport=window.visualViewport;
    const layoutHeight=Math.max(document.documentElement.clientHeight||0,window.innerHeight||0);
    const height=Math.max(1,Math.round(viewport&&viewport.height?viewport.height:layoutHeight));
    const offset=Math.max(0,Math.round(viewport&&Number.isFinite(viewport.offsetTop)?viewport.offsetTop:0));
    const imeInset=Math.max(0,Math.round(layoutHeight-height-offset));
    const style=document.documentElement.style;
    style.setProperty('--viewport-height',height+'px');
    style.setProperty('--viewport-offset',offset+'px');
    style.setProperty('--ime-inset',imeInset+'px');
    document.body.classList.toggle('ime-open',imeInset>80);
    if(imeInset>80) scrollActiveEntry();
  }
  function focusableWithin(container){
    return Array.from(container.querySelectorAll(FOCUSABLE)).filter(element=>!element.hidden&&element.getClientRects().length>0);
  }
  function focusElement(element){
    setTimeout(()=>{
      if(element&&element.isConnected&&typeof element.focus==='function') element.focus({preventScroll:true});
    },30);
  }
  function trapFocus(event,container){
    if(event.key!=='Tab'||!container) return;
    const elements=focusableWithin(container);
    if(!elements.length){event.preventDefault();return;}
    const first=elements[0];
    const last=elements[elements.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
  function syncOverlayState(){
    const commandOpen=!$('cmdPanel').hidden;
    document.body.classList.toggle('overlay-open',commandOpen||activeRoute!=='main');
    document.querySelector('.shell').setAttribute('aria-hidden',commandOpen||activeRoute!=='main'?'true':'false');
  }
  function routeFromState(state){
    const route=state&&state.a2hRoute;
    return route&&ROUTES[route]?route:'main';
  }
  function syncRouteMotion(){
    const motionAllowed=!document.hidden&&!applyBusy&&Date.now()>=motionPausedUntil;
    document.querySelector('.shell').classList.toggle('motion-active',motionAllowed&&activeRoute==='main');
    Object.keys(ROUTES).forEach(route=>{
      $(ROUTES[route]).classList.toggle('motion-active',motionAllowed&&route===activeRoute);
    });
  }
  function prioritizeInteraction(duration){
    const pause=Math.max(80,Number(duration)||260);
    motionPausedUntil=Math.max(motionPausedUntil,Date.now()+pause);
    if(motionResumeTimer) clearTimeout(motionResumeTimer);
    syncRouteMotion();
    motionResumeTimer=setTimeout(()=>{
      motionResumeTimer=0;
      syncRouteMotion();
    },Math.max(0,motionPausedUntil-Date.now())+16);
  }
  function transitionRoute(next,back){
    if(next===activeRoute) return;
    const previous=activeRoute;
    const previousPage=ROUTES[previous]?$(ROUTES[previous]):null;
    const nextPage=ROUTES[next]?$(ROUTES[next]):null;
    clearTimeout(routeTimer);
    if(previousPage) previousPage.setAttribute('aria-hidden','true');
    if(nextPage){
      nextPage.hidden=false;
      nextPage.setAttribute('aria-hidden','false');
      nextPage.classList.remove('closing','entering','dragging','settling');
      nextPage.querySelector('.route-shell').style.removeProperty('--sheet-drag');
      if(!back){
        void nextPage.offsetWidth;
        nextPage.classList.add('entering');
        setTimeout(()=>nextPage.classList.remove('entering'),320);
      }
    }
    if(back&&previousPage){
      previousPage.classList.remove('entering');
      previousPage.classList.add('closing');
      routeTimer=setTimeout(()=>{
        previousPage.hidden=true;
        previousPage.setAttribute('aria-hidden','true');
        previousPage.classList.remove('closing','dragging','settling');
        previousPage.querySelector('.route-shell').style.removeProperty('--sheet-drag');
        if(previous==='qr'){
          $('donateImage').removeAttribute('src');
          $('donateImage').alt='';
        }
      },250);
    }
    activeRoute=next;
    syncRouteMotion();
    syncOverlayState();
    const focusTarget=back?routeReturnFocus[previous]:(nextPage&&nextPage.querySelector('[data-route-back]'));
    focusElement(focusTarget||(nextPage&&focusableWithin(nextPage)[0]));
  }
  function navigateRoute(route){
    if(!ROUTES[route]||route===activeRoute) return;
    routeReturnFocus[route]=document.activeElement;
    if(route==='donate'){
      document.querySelectorAll('[data-payment-src]').forEach(image=>{
        if(!image.getAttribute('src')) image.src=image.dataset.paymentSrc;
      });
    }
    history.pushState({a2hRoute:route},'',location.pathname+location.search+'#'+route);
    transitionRoute(route,false);
  }
  function openDonation(key){
    const item=DONATIONS[key];
    if(!item) return;
    $('donateImage').src=item.src;
    $('donateImage').alt=item.alt;
    $('qrTitle').textContent=item.title;
    $('qrHint').textContent='请使用'+item.title+'扫码';
    haptic('confirm');
    navigateRoute('qr');
  }
  window.A2HWebUIBack=function(){
    if(hideCommand()) return true;
    if(isTextEntry(document.activeElement)){
      document.activeElement.blur();
      syncViewport();
      return true;
    }
    if(activeRoute==='main') return false;
    history.back();
    return true;
  };

  function normalizeSlot(value){return String(value||'').trim();}
  function cloneSlots(values){
    const result=DEFAULTS.slice();
    (Array.isArray(values)?values:[]).slice(0,10).forEach((value,index)=>{result[index]=normalizeSlot(value);});
    return result;
  }
  function cloneEnabled(values,names){
    const packages=Array.isArray(names)?names:slots;
    const result=packages.slice(0,10).map(value=>Boolean(normalizeSlot(value)));
    while(result.length<10) result.push(false);
    if(!Array.isArray(values)) return result;
    values.slice(0,10).forEach((value,index)=>{
      if(value===true || value===1 || value==='1' || value==='true') result[index]=true;
      else if(value===false || value===0 || value==='0' || value==='false') result[index]=false;
    });
    return result;
  }
  function isValidPackage(value){return value.length<64 && /^[A-Za-z][A-Za-z0-9_.]*\.[A-Za-z0-9_.]+$/.test(value);}

  function loadLocal(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY)||LEGACY_STORAGE_KEYS.map(key=>localStorage.getItem(key)).find(Boolean);
      if(!raw) return;
      const data=JSON.parse(raw);
      if(data&&Array.isArray(data.packages)){
        slots=cloneSlots(data.packages);
        slotEnabled=cloneEnabled(data.enabled,slots);
      }
      mode=data&&data.mode==='global'?'global':'whitelist';
      gameAutoPause=data&&data.gameAutoPause==='disabled'?'disabled':'enabled';
    }catch(error){}
  }
  function saveLocal(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:6,mode,gameAutoPause,packages:slots,enabled:slotEnabled}));}catch(error){}
  }
  function setNotice(text,kind,sticky){
    const toast=$('toast');
    if(toastTimer) clearTimeout(toastTimer);
    if(toastDismissTimer) clearTimeout(toastDismissTimer);
    toast.style.removeProperty('--snackbar-x');
    toast.className='toast show'+(kind?' '+kind:'');
    toast.textContent=text;
    if(!sticky) toastTimer=setTimeout(()=>dismissNotice(),kind==='err'?10000:4000);
  }
  function dismissNotice(direction){
    const toast=$('toast');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=0;
    if(direction){
      toast.classList.remove('dragging');
      toast.classList.add('dismissing');
      toast.style.setProperty('--snackbar-x',(direction<0?-1:1)*Math.max(window.innerWidth,360)+'px');
      toastDismissTimer=setTimeout(()=>{
        toast.className='toast';
        toast.style.removeProperty('--snackbar-x');
      },230);
      return;
    }
    toast.className='toast';
    toast.style.removeProperty('--snackbar-x');
  }
  function showCommand(){
    const panel=$('cmdPanel');
    if(!panel.hidden) return;
    commandReturnFocus=document.activeElement;
    panel.hidden=false;
    panel.setAttribute('aria-hidden','false');
    syncOverlayState();
    focusElement($('cmdClose'));
  }
  function hideCommand(){
    const panel=$('cmdPanel');
    if(panel.hidden) return false;
    panel.hidden=true;
    panel.setAttribute('aria-hidden','true');
    syncOverlayState();
    focusElement(commandReturnFocus);
    commandReturnFocus=null;
    return true;
  }
  function bindSheetDrag(handle){
    const page=handle.closest('.route-page');
    const shell=page.querySelector('.route-shell');
    let pointerId=null;
    let startY=0;
    let currentY=0;
    let startedAt=0;
    const finishActive=cancelled=>{
      const distance=Math.max(0,currentY-startY);
      const elapsed=Math.max(1,performance.now()-startedAt);
      const shouldClose=!cancelled&&(distance>Math.max(72,page.clientHeight*.12)||distance/elapsed>.65);
      pointerId=null;
      page.classList.remove('dragging');
      if(shouldClose){
        haptic('button');
        window.A2HWebUIBack();
      }else{
        page.classList.add('settling');
        shell.style.setProperty('--sheet-drag','0px');
        setTimeout(()=>{
          page.classList.remove('settling');
          shell.style.removeProperty('--sheet-drag');
        },240);
      }
    };
    const move=clientY=>{
      currentY=Math.max(startY,clientY);
      shell.style.setProperty('--sheet-drag',(currentY-startY)+'px');
    };
    const finish=event=>{
      if(pointerId===null||event.pointerId!==pointerId) return;
      finishActive(event.type==='pointercancel');
    };
    handle.addEventListener('pointerdown',event=>{
      if(page.hidden||ROUTES[activeRoute]!==page.id||event.button>0) return;
      pointerId=event.pointerId;
      startY=currentY=event.clientY;
      startedAt=performance.now();
      page.classList.remove('settling');
      page.classList.add('dragging');
      try{handle.setPointerCapture(pointerId);}catch(error){}
    });
    handle.addEventListener('pointermove',event=>{
      if(event.pointerId!==pointerId) return;
      move(event.clientY);
    });
    handle.addEventListener('pointerup',finish);
    handle.addEventListener('pointercancel',finish);
    window.addEventListener('mousemove',event=>{if(pointerId!==null) move(event.clientY);});
    window.addEventListener('mouseup',()=>{if(pointerId!==null) finishActive(false);});
  }
  function bindSnackbarSwipe(){
    const toast=$('toast');
    let pointerId=null;
    let startX=0;
    let startY=0;
    let currentX=0;
    let startedAt=0;
    let dragging=false;
    const finishActive=cancelled=>{
      const distance=currentX-startX;
      const elapsed=Math.max(1,performance.now()-startedAt);
      const shouldDismiss=!cancelled&&dragging&&(Math.abs(distance)>Math.max(72,toast.clientWidth*.28)||Math.abs(distance/elapsed)>.65);
      pointerId=null;
      dragging=false;
      if(shouldDismiss){dismissNotice(distance);return;}
      toast.classList.remove('dragging');
      toast.style.setProperty('--snackbar-x','0px');
    };
    const move=(clientX,clientY,preventDefault)=>{
      const dx=clientX-startX;
      const dy=clientY-startY;
      if(!dragging&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){
        dragging=true;
        toast.classList.add('dragging');
      }
      if(!dragging) return;
      currentX=clientX;
      toast.style.setProperty('--snackbar-x',dx+'px');
      if(preventDefault) preventDefault();
    };
    const finish=event=>{
      if(pointerId===null||event.pointerId!==pointerId) return;
      finishActive(event.type==='pointercancel');
    };
    toast.addEventListener('pointerdown',event=>{
      if(!toast.classList.contains('show')||event.button>0) return;
      pointerId=event.pointerId;
      startX=currentX=event.clientX;
      startY=event.clientY;
      startedAt=performance.now();
      try{toast.setPointerCapture(pointerId);}catch(error){}
    });
    toast.addEventListener('pointermove',event=>{
      if(event.pointerId!==pointerId) return;
      move(event.clientX,event.clientY,()=>event.preventDefault());
    });
    toast.addEventListener('pointerup',finish);
    toast.addEventListener('pointercancel',finish);
    window.addEventListener('mousemove',event=>{if(pointerId!==null) move(event.clientX,event.clientY);});
    window.addEventListener('mouseup',()=>{if(pointerId!==null) finishActive(false);});
  }

  function renderMode(){
    const global=mode==='global';
    const interactionLocked=applyBusy||interactionBusy;
    $('globalMode').checked=global;
    $('globalMode').disabled=!deviceConfigReady||interactionLocked;
    $('modeValue').textContent=deviceConfigReady?(global?'开启 · 所有应用':'关闭 · 10 槽白名单'):(deviceConfigStatus==='error'?'读取失败':'正在读取');
    const backgroundHaptic=gameAutoPause==='disabled';
    $('gamePause').checked=backgroundHaptic;
    $('gamePause').disabled=!deviceConfigReady||interactionLocked;
    $('policyValue').textContent=deviceConfigReady?(backgroundHaptic?'开启 · 游戏内保持触感':'关闭 · 遵循官方策略'):(deviceConfigStatus==='error'?'读取失败':'正在读取');
    $('reset').disabled=!deviceConfigReady||interactionLocked;
    document.querySelectorAll('.slot-input').forEach(input=>{input.disabled=!deviceConfigReady||interactionLocked;});
    document.querySelectorAll('.slot-switch input').forEach(toggle=>{
      const row=toggle.closest('.slot');
      const input=row&&row.querySelector('.slot-input');
      toggle.disabled=!deviceConfigReady||interactionLocked||!normalizeSlot(input&&input.value);
    });
  }
  function updateCount(){
    let active=0;
    slots.forEach((value,index)=>{if(slotEnabled[index]&&normalizeSlot(value)) active++;});
    $('count').textContent=active+' / 10';
  }
  function refreshValidation(){
    const values=slots.map(normalizeSlot);
    const counts={};
    values.forEach((value,index)=>{if(value&&slotEnabled[index]) counts[value]=(counts[value]||0)+1;});
    document.querySelectorAll('.slot-input').forEach((input,index)=>{
      const value=normalizeSlot(input.value);
      const invalid=Boolean(value)&&!isValidPackage(value);
      const duplicate=Boolean(value)&&slotEnabled[index]&&counts[value]>1;
      input.classList.toggle('invalid',invalid);
      input.classList.toggle('dup',!invalid&&duplicate);
    });
  }
  function renderSlots(){
    slots=cloneSlots(slots);
    slotEnabled=cloneEnabled(slotEnabled,slots);
    const root=$('slots');
    root.innerHTML='';
    slots.forEach((value,index)=>{
      const row=document.createElement('div');
      row.className='slot';
      const number=document.createElement('span');
      number.className='slot-num';
      number.textContent=String(index+1).padStart(2,'0');
      const wrap=document.createElement('div');
      wrap.className='slot-wrap';
      const input=document.createElement('input');
      input.className='slot-input'+(index<6?' official':'');
      input.value=value;
      input.placeholder=LABELS[index];
      input.title=LABELS[index];
      input.autocomplete='off';
      input.spellcheck=false;
      input.maxLength=63;
      input.disabled=!deviceConfigReady||applyBusy||interactionBusy;
      let committed=value;
      const toggle=document.createElement('input');
      input.addEventListener('input',()=>{
        slots[index]=normalizeSlot(input.value);
        if(!slots[index]){
          slotEnabled[index]=false;
          toggle.checked=false;
        }
        toggle.disabled=applyBusy||interactionBusy||!slots[index];
        updateCount();
        refreshValidation();
        hideCommand();
      });
      const commitInput=()=>{
        const next=normalizeSlot(input.value);
        if(next===committed) return;
        committed=next;
        slots[index]=next;
        if(!next){slotEnabled[index]=false;toggle.checked=false;toggle.disabled=true;}
        else toggle.disabled=applyBusy||interactionBusy;
        configRevision++;
        saveLocal();
        updateCount();
        refreshValidation();
        haptic('tick');
        requestApply('包名已更新',true);
      };
      input.addEventListener('change',commitInput);
      input.addEventListener('blur',commitInput);
      input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();input.blur();}});
      const toggleLabel=document.createElement('label');
      toggleLabel.className='switch slot-switch';
      toggleLabel.title='启用 '+LABELS[index];
      toggle.type='checkbox';
      toggle.setAttribute('role','switch');
      toggle.setAttribute('aria-label',LABELS[index]+'开关');
      toggle.checked=Boolean(slotEnabled[index]&&value);
      toggle.disabled=!deviceConfigReady||applyBusy||interactionBusy||!value;
      toggle.addEventListener('change',()=>{
        const current=normalizeSlot(input.value);
        if(!current){toggle.checked=false;slotEnabled[index]=false;return;}
        if(toggle.checked&&!isValidPackage(current)){
          toggle.checked=false;slotEnabled[index]=false;refreshValidation();haptic('error');setNotice('请先填写有效包名','err');return;
        }
        if(toggle.checked&&slotEnabled.some((enabled,other)=>other!==index&&enabled&&normalizeSlot(slots[other])===current)){
          toggle.checked=false;slotEnabled[index]=false;refreshValidation();haptic('error');setNotice('启用槽位不能重复','err');return;
        }
        slotEnabled[index]=toggle.checked;
        configRevision++;
        saveLocal();
        updateCount();
        refreshValidation();
        hideCommand();
        haptic('toggle');
        requestApply('槽位 '+String(index+1)+' 已更新',true);
      });
      const track=document.createElement('span');
      track.className='track';
      toggleLabel.append(toggle,track);
      wrap.appendChild(input);
      if(index<6){
        const tag=document.createElement('span');
        tag.className='slot-tag';
        tag.textContent='官方';
        wrap.appendChild(tag);
      }
      row.append(number,wrap,toggleLabel);
      root.appendChild(row);
    });
    updateCount();
    refreshValidation();
  }
  function render(){renderMode();renderSlots();}

  function shellQuote(value){return "'"+String(value).replace(/'/g,"'\"'\"'")+"'";}
  function buildHapticCommand(kind){
    const effects={tick:[8,90],button:[12,140],toggle:[16,180],confirm:[24,220],error:[36,255]};
    const effect=effects[kind]||effects.button;
    return '(cmd vibrator_manager synced -f -d a2h_webui oneshot '+effect[0]+' '+effect[1]+' || cmd vibrator vibrate -f '+effect[0]+' a2h_webui || true) >/dev/null 2>&1';
  }
  function snapshotConfig(){
    const packages=cloneSlots(slots);
    return {mode:mode==='global'?'global':'whitelist',gameAutoPause:gameAutoPause==='disabled'?'disabled':'enabled',packages,enabled:cloneEnabled(slotEnabled,packages),generation:String(Date.now())};
  }
  function snapshotKey(data){return JSON.stringify({mode:data.mode,gameAutoPause:data.gameAutoPause,packages:data.packages,enabled:data.enabled});}
  function validationMessage(data){
    const seen=new Set();
    for(let index=0;index<10;index++){
      const value=normalizeSlot(data.packages[index]);
      if(!data.enabled[index]||!value) continue;
      if(!isValidPackage(value)) return '第 '+String(index+1)+' 槽包名无效';
      if(seen.has(value)) return '启用槽位不能重复';
      seen.add(value);
    }
    return '';
  }

  function buildCommitCommand(state,snapshot,writePackages){
    const data=snapshot||snapshotConfig();
    const mode=state==='enabled'?'enabled':'disabled';
    const policy=data.gameAutoPause==='disabled'?'disabled':'enabled';
    if(!writePackages){
      return 'sh /data/adb/modules/a2h_hook/bin/a2h_apply queue-controls-fast '+shellQuote(mode)+' '+shellQuote(policy);
    }
    const values=data.packages.slice(0,10).map(normalizeSlot);
    const states=data.enabled.slice(0,10).map(value=>value?'1':'0');
    while(values.length<10) values.push('');
    while(states.length<10) states.push('0');
    return ['sh /data/adb/modules/a2h_hook/bin/a2h_apply commit-queue',shellQuote(mode),shellQuote(policy),shellQuote(data.generation)]
      .concat(values.map(shellQuote),states.map(shellQuote)).join(' ');
  }
  function buildCommand(state,snapshot,writePackages){
    const data=snapshot||snapshotConfig();
    data.mode=state==='enabled'?'global':'whitelist';
    return '# A2HHook apply command\n'+buildCommitCommand(state,data,writePackages);
  }

  function findExecBridge(){
    if(window.ksu&&typeof window.ksu.exec==='function') return {kind:'raw',owner:window.ksu,fn:window.ksu.exec};
    if(window.KSU&&typeof window.KSU.exec==='function') return {kind:'promise',owner:window.KSU,fn:window.KSU.exec};
    if(typeof window.exec==='function') return {kind:'callback',owner:window,fn:window.exec};
    return null;
  }
  function normalizeExecResult(result,depth){
    const level=depth||0;
    if(result==null) return {code:undefined,stdout:'',stderr:''};
    if(typeof result==='number') return {code:result,stdout:'',stderr:''};
    if(typeof result==='string'){
      try{
        const parsed=JSON.parse(result);
        if(parsed!==result) return normalizeExecResult(parsed,level+1);
      }catch(error){}
      return {code:undefined,stdout:result,stderr:''};
    }
    if(typeof result!=='object') return {code:undefined,stdout:String(result),stderr:''};
    let code=result.code??result.exitCode??result.status??result.errno;
    if(result.success===false&&code===undefined) code=1;
    let stdout=result.stdout??result.out??result.output;
    let stderr=result.stderr??result.err??'';
    if(stdout===undefined&&level<3){
      const nested=result.result??result.data??result.value;
      if(nested!==undefined&&nested!==result){
        const normalized=normalizeExecResult(nested,level+1);
        if(code===undefined) code=normalized.code;
        stdout=normalized.stdout;
        if(!stderr) stderr=normalized.stderr;
      }
    }
    if(stdout===undefined&&result.message!==undefined) stdout=result.message;
    return {code:code===undefined?undefined:Number(code),stdout:String(stdout??''),stderr:String(stderr??'')};
  }
  function invokeRawBridge(bridge,command,timeoutMs){
    return new Promise((resolve,reject)=>{
      let settled=false;
      const callbackName='__a2h_exec_'+Date.now()+'_'+(++execSerial);
      const cleanup=()=>{clearTimeout(timer);try{delete window[callbackName];}catch(error){window[callbackName]=undefined;}};
      const finish=value=>{if(!settled){settled=true;cleanup();resolve(value);}};
      const fail=error=>{if(!settled){settled=true;cleanup();reject(error);}};
      const accept=returned=>{
        if(returned&&typeof returned.then==='function') returned.then(finish,fail);
        else if(returned!==undefined&&returned!==null) finish(returned);
      };
      const timer=setTimeout(()=>fail(new Error('timeout')),timeoutMs||8000);
      window[callbackName]=(errno,stdout,stderr)=>finish({code:errno,stdout,stderr});
      try{
        accept(bridge.fn.call(bridge.owner,command,'{}',callbackName));
      }catch(threeArgError){
        try{
          accept(bridge.fn.call(bridge.owner,command,callbackName));
        }catch(twoArgError){
          try{accept(bridge.fn.call(bridge.owner,command));}
          catch(oneArgError){fail(oneArgError);}
        }
      }
    });
  }
  function invokeGenericBridge(bridge,command,timeoutMs){
    return new Promise((resolve,reject)=>{
      let settled=false;
      const timer=setTimeout(()=>fail(new Error('timeout')),timeoutMs||8000);
      const finish=value=>{if(!settled){settled=true;clearTimeout(timer);resolve(value);}};
      const fail=error=>{if(!settled){settled=true;clearTimeout(timer);reject(error);}};
      const callback=(...args)=>args.length<=1?finish(args[0]):finish({code:args[0],stdout:args[1],stderr:args[2]});
      try{
        const returned=bridge.kind==='callback'?
          bridge.fn.call(bridge.owner,command,callback):
          bridge.fn.call(bridge.owner,command,{});
        if(returned&&typeof returned.then==='function') returned.then(finish,fail);
        else if(returned!==undefined&&returned!==null) finish(returned);
        else if(bridge.kind==='promise') fail(new Error('missing-exec-result'));
      }catch(error){fail(error);}
    });
  }
  async function execRoot(command,timeoutMs){
    const bridge=findExecBridge();
    if(!bridge) throw new Error('no-exec');
    const rcMarker='__A2H_EXEC_RC_'+Date.now()+'_'+(++execSerial)+'__';
    const wrapped='( '+command+'\n); a2h_exec_rc=$?; printf \'\\n'+rcMarker+'%s\\n\' "$a2h_exec_rc"; exit 0';
    const raw=bridge.kind==='raw'?await invokeRawBridge(bridge,wrapped,timeoutMs):await invokeGenericBridge(bridge,wrapped,timeoutMs);
    const result=normalizeExecResult(raw);
    const markerAt=result.stdout.lastIndexOf(rcMarker);
    if(markerAt<0){
      if(result.code!==undefined&&result.code!==0) throw new Error('exit '+result.code);
      throw new Error('missing-exec-status');
    }
    const rcMatch=result.stdout.slice(markerAt+rcMarker.length).match(/^(-?[0-9]+)/);
    if(!rcMatch) throw new Error('invalid-exec-status');
    const code=Number(rcMatch[1]);
    const stdout=result.stdout.slice(0,markerAt).replace(/\r?\n$/,'');
    if(code!==0) throw new Error('exit '+code+(result.stderr?': '+result.stderr:''));
    return {code,stdout,stderr:result.stderr};
  }
  function extractStdout(result){
    return normalizeExecResult(result).stdout;
  }

  async function openSystemLink(event){
    const link=event.currentTarget;
    const fallback=link.href;
    const uri=link.dataset.intentUri||fallback;
    const packageName=link.dataset.appPackage||'';
    event.preventDefault();
    try{
      const packageArg=packageName?' -p '+shellQuote(packageName):'';
      await execRoot('am start --user 0 -a android.intent.action.VIEW -d '+shellQuote(uri)+packageArg,3500);
    }catch(error){
      console&&console.warn&&console.warn(error);
      if(link.hasAttribute('data-no-browser-fallback')){
        setNotice('未安装 QQ 或无法打开群聊','warn');
        return;
      }
      const opened=window.open(fallback,'_blank','noopener,noreferrer');
      if(!opened) window.location.href=fallback;
    }
  }

  function requestApply(reason,writePackages){
    if(!deviceConfigReady){setNotice('正在读取设备配置','warn');return;}
    applyPending=true;
    packageWritePending=packageWritePending||Boolean(writePackages);
    applyReason=reason||'配置已更新';
    // Publish the local state immediately, then keep configuration controls
    // greyed out until the root transaction has authoritative readback.
    interactionBusy=true;
    renderMode();
    prioritizeInteraction(420);
    scheduleApplyDrain();
  }
  function scheduleApplyDrain(){
    if(applyBusy||applyDrainScheduled) return;
    applyDrainScheduled=true;
    const run=()=>{
      applyDrainScheduled=false;
      drainApply();
    };
    if(document.hidden){setTimeout(run,0);return;}
    requestAnimationFrame(()=>setTimeout(run,0));
  }
  async function drainApply(){
    if(applyBusy) return;
    applyBusy=true;
    renderMode();
    syncRouteMotion();
    try{
      while(applyPending){
        applyPending=false;
        const writePackages=packageWritePending;
        packageWritePending=false;
        const data=snapshotConfig();
        const error=validationMessage(data);
        if(error){refreshValidation();setNotice(error,'err');continue;}
        const key=snapshotKey(data);
        if(key===lastAppliedKey&&!writePackages){saveLocal();continue;}
        const state=data.mode==='global'?'enabled':'disabled';
        setNotice('正在保存：'+applyReason,'',true);
        try{
          const command=buildCommitCommand(state,data,writePackages)+' && '+buildReadDeviceCommand(writePackages);
          const commit=execRoot(command,15000);
          flushRootHaptic();
          const text=extractStdout(await commit);
          verifyDeviceConfig(text,data,writePackages);
          lastAppliedKey=key;
          if(snapshotKey(snapshotConfig())===key){
            saveLocal();
            hideCommand();
            setNotice('已保存，正在后台应用','ok');
          }
        }catch(error){
          console&&console.warn&&console.warn(error);
          packageWritePending=packageWritePending||writePackages;
          if(applyPending||snapshotKey(snapshotConfig())!==key){
            setNotice('上一项保存失败，正在处理最新配置','warn');
            continue;
          }
          $('cmdText').textContent=buildCommand(state,data,writePackages);
          showCommand();
          setNotice('保存校验失败，正在恢复设备状态','warn',true);
          const restored=await loadDeviceConfig({preserveNotice:true});
          packageWritePending=false;
          setNotice(restored?'保存失败，已恢复设备状态':'保存失败，设备状态读取失败','err');
        }
      }
    }finally{
      applyBusy=false;
      if(!applyPending) interactionBusy=false;
      renderMode();
      prioritizeInteraction(180);
      if(applyPending) scheduleApplyDrain();
    }
  }

  function parseDeviceSection(text,startMarker,endMarker){
    const start=text.indexOf(startMarker);
    if(start<0) return null;
    const from=start+startMarker.length;
    const end=endMarker?text.indexOf(endMarker,from):-1;
    if(endMarker&&end<0) return null;
    let value=end<0?text.slice(from):text.slice(from,end);
    if(value.startsWith('\r\n')) value=value.slice(2);
    else if(value.startsWith('\n')) value=value.slice(1);
    if(value.endsWith('\n')) value=value.slice(0,-1);
    if(value.endsWith('\r')) value=value.slice(0,-1);
    return value;
  }
  function buildReadDeviceCommand(includePackages){
    const lines=[
      "printf '%s\\n' "+shellQuote(DEVICE_MARKERS.state),
      'cat /data/adb/modules/a2h_hook/config/state 2>/dev/null || exit 2',
      "printf '%s\\n' "+shellQuote(DEVICE_MARKERS.policy),
      'cat /data/adb/modules/a2h_hook/config/game_auto_pause 2>/dev/null || exit 2'
    ];
    if(includePackages){
      lines.push(
        "printf '%s\\n' "+shellQuote(DEVICE_MARKERS.packages),
        'cat /data/adb/modules/a2h_hook/config/packages.txt 2>/dev/null || exit 2',
        "printf '%s\\n' "+shellQuote(DEVICE_MARKERS.states),
        'cat /data/adb/modules/a2h_hook/config/package_states 2>/dev/null || true'
      );
    }
    lines.push("printf '%s\\n' "+shellQuote(DEVICE_MARKERS.end));
    return lines.join('; ');
  }
  function parseDeviceMode(text,endMarker){
    const stateText=parseDeviceSection(text,DEVICE_MARKERS.state,endMarker||DEVICE_MARKERS.policy);
    if(stateText===null) throw new Error('missing-device-state');
    const state=stateText.trim();
    if(state!=='enabled'&&state!=='disabled') throw new Error('invalid-device-state');
    return state==='enabled'?'global':'whitelist';
  }
  function parseDevicePolicy(text,endMarker){
    const policyText=parseDeviceSection(text,DEVICE_MARKERS.policy,endMarker||DEVICE_MARKERS.end);
    if(policyText===null) throw new Error('missing-device-policy');
    const policy=policyText.trim();
    if(policy!=='enabled'&&policy!=='disabled') throw new Error('invalid-device-policy');
    return policy;
  }
  function parseDeviceConfig(text){
    if(text.indexOf(DEVICE_MARKERS.end)<0) throw new Error('incomplete-device-config');
    const packageText=parseDeviceSection(text,DEVICE_MARKERS.packages,DEVICE_MARKERS.states);
    const stateText=parseDeviceSection(text,DEVICE_MARKERS.states,DEVICE_MARKERS.end);
    if(packageText===null||stateText===null) throw new Error('invalid-device-config');
    const packages=Array(10).fill('');
    packageText.replace(/\r/g,'').split('\n').slice(0,10).forEach((line,index)=>{packages[index]=normalizeSlot(line);});
    const rawStates=stateText.replace(/\r/g,'').split('\n').map(value=>value.trim());
    return {mode:parseDeviceMode(text,DEVICE_MARKERS.policy),gameAutoPause:parseDevicePolicy(text,DEVICE_MARKERS.packages),packages,enabled:cloneEnabled(rawStates,packages)};
  }
  function verifyDeviceConfig(text,expected,includePackages){
    const actual=includePackages?parseDeviceConfig(text):{mode:parseDeviceMode(text),gameAutoPause:parseDevicePolicy(text)};
    if(actual.mode!==expected.mode) throw new Error('device-mode-mismatch');
    if(actual.gameAutoPause!==expected.gameAutoPause) throw new Error('device-policy-mismatch');
    if(includePackages){
      const expectedPackages=cloneSlots(expected.packages);
      const expectedEnabled=cloneEnabled(expected.enabled,expectedPackages);
      for(let index=0;index<10;index++){
        if(actual.packages[index]!==expectedPackages[index]||actual.enabled[index]!==expectedEnabled[index]) throw new Error('device-config-mismatch');
      }
    }
    return actual;
  }
  async function loadDeviceConfig(options){
    const settings=options||{};
    deviceConfigReady=false;
    deviceConfigStatus='loading';
    renderMode();
    renderSlots();
    const startRevision=configRevision;
    try{
      const text=extractStdout(await execRoot(buildReadDeviceCommand(true),6000));
      if(configRevision!==startRevision){
        if(!settings.preserveNotice) setNotice('保留当前编辑内容','warn');
        return false;
      }
      const data=parseDeviceConfig(text);
      mode=data.mode;
      gameAutoPause=data.gameAutoPause;
      slots=data.packages;
      slotEnabled=data.enabled;
      deviceConfigReady=true;
      deviceConfigStatus='ready';
      configRevision++;
      render();
      saveLocal();
      lastAppliedKey=snapshotKey(snapshotConfig());
      $('retry').hidden=true;
      return true;
    }catch(error){
      console&&console.warn&&console.warn(error);
      deviceConfigReady=false;
      deviceConfigStatus='error';
      renderMode();
      renderSlots();
      $('retry').hidden=false;
      if(!settings.preserveNotice) setNotice('设备配置读取失败','warn');
      return false;
    }
  }

  $('globalMode').addEventListener('change',event=>{
    if(!deviceConfigReady){event.target.checked=mode==='global';haptic('error');setNotice('设备配置尚未载入','warn');return;}
    mode=event.target.checked?'global':'whitelist';
    configRevision++;
    renderMode();
    haptic('toggle');
    requestApply(mode==='global'?'全局模式已开启':'白名单模式已开启',false);
  });
  $('gamePause').addEventListener('change',event=>{
    if(!deviceConfigReady){event.target.checked=gameAutoPause==='disabled';haptic('error');setNotice('设备配置尚未载入','warn');return;}
    gameAutoPause=event.target.checked?'disabled':'enabled';
    configRevision++;
    renderMode();
    haptic('toggle');
    requestApply(event.target.checked?'游戏后台音乐触感已开启':'已恢复官方游戏策略',false);
  });
  $('theme').addEventListener('click',()=>{
    const root=document.documentElement;
    const current=root.dataset.themeMode||'system';
    const next=current==='system'?'light':(current==='light'?'dark':'system');
    applyThemeMode(next,true);
    setNotice(next==='system'?'主题已跟随系统':(next==='dark'?'已切换为深色主题':'已切换为浅色主题'),'ok');
  });
  $('reset').addEventListener('click',()=>{
    if(!deviceConfigReady){setNotice('设备配置尚未载入','warn');return;}
    slots=DEFAULTS.slice();
    slotEnabled=[true,true,true,true,true,true,false,false,false,false];
    configRevision++;
    renderSlots();
    saveLocal();
    requestApply('已恢复官方默认',true);
  });
  $('retry').addEventListener('click',()=>{
    $('retry').hidden=true;
    setNotice('正在重新读取配置','',true);
    loadDeviceConfig();
  });
  $('cmdClose').addEventListener('click',hideCommand);
  $('cmdPanel').addEventListener('click',event=>{if(event.target===$('cmdPanel')) hideCommand();});
  $('copy').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText($('cmdText').textContent);setNotice('命令已复制','ok');hideCommand();}
    catch(error){setNotice('请长按命令手动复制','warn');}
  });
  $('about').addEventListener('click',()=>navigateRoute('about'));
  $('support').addEventListener('click',()=>navigateRoute('donate'));
  $('donateSupport').addEventListener('click',()=>navigateRoute('donate'));
  document.querySelectorAll('[data-route-back]').forEach(button=>button.addEventListener('click',()=>window.A2HWebUIBack()));
  document.querySelectorAll('[data-sheet-handle]').forEach(bindSheetDrag);
  bindSnackbarSwipe();
  document.querySelectorAll('.route-page').forEach(page=>page.addEventListener('click',event=>{
    if(event.target!==page||activeRoute==='main') return;
    haptic('button');
    window.A2HWebUIBack();
  }));
  document.querySelectorAll('[data-donate]').forEach(button=>button.addEventListener('click',()=>openDonation(button.dataset.donate)));
  $('strongHaptic').addEventListener('change',event=>setStrongHaptic(event.target.checked,true));
  document.querySelectorAll('[data-haptic]').forEach(control=>control.addEventListener('click',()=>haptic(control.dataset.haptic||'button')));
  document.querySelectorAll('.social-link,[data-system-link]').forEach(link=>link.addEventListener('click',openSystemLink));
  window.addEventListener('popstate',event=>transitionRoute(routeFromState(event.state),true));
  document.addEventListener('visibilitychange',syncRouteMotion);
  document.addEventListener('focusin',event=>{if(isTextEntry(event.target)) scrollActiveEntry();});
  document.addEventListener('keydown',event=>{
    const modal=!$('cmdPanel').hidden?$('cmdPanel'):(activeRoute!=='main'?$(ROUTES[activeRoute]):null);
    trapFocus(event,modal);
    if(event.key==='Escape'&&window.A2HWebUIBack()) event.preventDefault();
  });
  window.addEventListener('resize',syncViewport);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',syncViewport);
    window.visualViewport.addEventListener('scroll',syncViewport);
  }
  if(window.matchMedia){
    const systemTheme=window.matchMedia('(prefers-color-scheme: dark)');
    const updateSystemTheme=event=>{
      if(document.documentElement.dataset.themeMode!=='system') return;
      document.documentElement.dataset.theme=event.matches?'dark':'light';
      renderThemeIcon();
      syncSystemBars();
    };
    if(systemTheme.addEventListener) systemTheme.addEventListener('change',updateSystemTheme);
    else if(systemTheme.addListener) systemTheme.addListener(updateSystemTheme);
  }
  window.A2HNativeTheme=dark=>{
    window.__A2H_NATIVE_DARK__=Boolean(dark);
    if(document.documentElement.dataset.themeMode==='system') applyThemeMode('system',false);
  };

  document.addEventListener('pointerdown',event=>{
    if(event.target&&event.target.closest&&event.target.closest('button,a,.preference,.switch')) prioritizeInteraction(260);
  },{capture:true,passive:true});

  enableImmersiveLayout();
  applyThemeMode(document.documentElement.dataset.themeMode||'system',false);
  history.replaceState({a2hRoute:'main'},'',location.pathname+location.search);
  syncViewport();
  syncOverlayState();
  syncRouteMotion();
  readHapticPreference();
  setStrongHaptic(strongHaptic,false);
  renderThemeIcon();
  loadLocal();
  render();
  loadDeviceConfig();
})();
</script>
