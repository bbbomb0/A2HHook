<style>
:root{--bg:#f3f5f6;--surface:#fff;--field:#f7f9fa;--line:#dce2e6;--text:#172027;--muted:#68757d;--accent:#08775a;--soft:#e1f2ec;--danger:#bd3f39;--warn:#916100;--shadow:0 8px 20px rgba(25,38,45,.07)}

*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:8px;background:var(--bg);color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{appearance:none}[hidden]{display:none!important}
.shell{width:min(100%,620px);margin:0 auto}.top{height:42px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;padding:0 2px}.brand{display:flex;align-items:center;gap:8px;min-width:0}.mark{width:34px;height:34px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}.brand-copy{min-width:0}.title{font-size:17px;font-weight:750;line-height:1.05}.sub{margin-top:2px;color:var(--muted);font-size:10px;white-space:nowrap}.top-actions{display:flex;align-items:center;gap:6px}.version{color:var(--muted);font-size:10px}.icon{width:34px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:17px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:var(--shadow)}.mode{height:38px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 7px;border-bottom:1px solid var(--line)}.mode-copy{display:flex;align-items:baseline;gap:7px;min-width:0}.mode-title{font-size:14px;font-weight:700}.mode-value{color:var(--muted);font-size:11px}.switch{position:relative;display:inline-flex;width:42px;height:26px;align-items:center;justify-content:center;cursor:pointer;flex:none}.switch input{position:absolute;width:1px;height:1px;opacity:0}.track{position:relative;width:40px;height:24px;border:1px solid var(--line);border-radius:12px;background:var(--field);pointer-events:none;transition:background .16s ease,border-color .16s ease}.track:after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .16s ease,background .16s ease}.switch input:checked+.track{border-color:var(--accent);background:var(--soft)}.switch input:checked+.track:after{transform:translateX(16px);background:var(--accent)}.switch input:focus-visible+.track{box-shadow:0 0 0 3px var(--soft)}
.toolbar{height:34px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 1px}.toolbar-actions{display:flex;align-items:center;gap:2px}.list-title{font-size:12px;font-weight:650}.count{margin-left:6px;color:var(--muted);font-size:10px}.reset{width:30px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--accent);font-size:18px;cursor:pointer}.reset:disabled{opacity:.4;cursor:not-allowed}.slots{display:grid;gap:4px}.slot{height:34px;display:grid;grid-template-columns:20px minmax(0,1fr) 40px;gap:4px;align-items:center}.slot-num{color:var(--muted);font-size:10px;text-align:center;font-variant-numeric:tabular-nums}.slot-wrap{position:relative;min-width:0}.slot-input{width:100%;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--text);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;outline:0}.slot-input.official{border-left:3px solid var(--accent);padding-right:30px}.slot-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}.slot-input:disabled{opacity:.55;cursor:not-allowed}.slot-input.invalid{border-color:var(--danger)}.slot-input.dup{border-color:var(--warn)}.slot-tag{position:absolute;right:7px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:9px;pointer-events:none}.slot-switch{width:40px;height:26px}.slot-switch .track{width:36px;height:22px}.slot-switch .track:after{width:16px;height:16px}.slot-switch input:checked+.track:after{transform:translateX(14px)}.switch input:disabled+.track{opacity:.4}.switch input:disabled{cursor:not-allowed}
.author{height:34px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;color:var(--muted)}.author-mark{font-size:10px;white-space:nowrap}.socials{display:flex;align-items:center;gap:3px}.social-link{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--muted);text-decoration:none;transition:color .16s ease,background .16s ease}.social-link:hover,.social-link:focus-visible{color:var(--accent);background:var(--soft);outline:0}.social-link svg{width:17px;height:17px;fill:currentColor}.coolapk-icon{width:19px;height:19px;display:block}
.toast{position:fixed;z-index:20;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,12px);width:min(calc(100% - 24px),520px);padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);box-shadow:0 10px 28px rgba(0,0,0,.18);color:var(--text);font-size:12px;text-align:center;opacity:0;visibility:hidden;transition:opacity .16s ease,transform .16s ease}.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}.toast.ok{color:var(--accent)}.toast.err{color:var(--danger)}.toast.warn{color:var(--warn)}
.cmd-panel{position:fixed;z-index:30;inset:0;padding:20px;background:rgba(0,0,0,.42);display:grid;place-items:center}.cmd-box{width:min(100%,520px);max-height:75vh;padding:12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}.cmd-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}.cmd-close{width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}.cmd-box code{display:block;max-height:45vh;overflow:auto;padding:9px;border-radius:6px;background:var(--field);color:var(--muted);font:10px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all}.cmd-copy{width:100%;height:34px;margin-top:8px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}

<script>
(function(){
  'use strict';
  const OFFICIAL=['com.kugou.android','com.tencent.qqmusic','com.netease.cloudmusic','cn.kuwo.player','com.miui.player','com.luna.music'];
  const DEFAULTS=OFFICIAL.concat(['','','','']);
  const LABELS=['酷狗音乐','QQ音乐','网易云音乐','酷我音乐','小米音乐','Luna音乐','自定义 1','自定义 2','自定义 3','自定义 4'];
  const STORAGE_KEY='a2h_config_v5';
  const LEGACY_STORAGE_KEY='a2h_config_v4';
  const DEVICE_MARKERS={state:'__A2H_DEVICE_STATE__',packages:'__A2H_DEVICE_PACKAGES__',states:'__A2H_DEVICE_STATES__',end:'__A2H_DEVICE_END__'};
  let mode='whitelist';
  let slots=DEFAULTS.slice();
  let slotEnabled=[true,true,true,true,true,true,false,false,false,false];
  let configRevision=0;
  let deviceConfigReady=false;
  let deviceConfigStatus='loading';
  let applyPending=false;
  let packageWritePending=false;
  let applyBusy=false;
  let applyReason='';
  let lastAppliedKey='';
  let toastTimer=0;
  let execSerial=0;
  const $=id=>document.getElementById(id);

  function normalizeSlot(value){return String(value||'').trim();}
  function cloneSlots(values){
    const result=DEFAULTS.slice();
    (Array.isArray(values)?values:[]).slice(0,10).forEach((value,index)=>{result[index]=normalizeSlot(value);});
    return result;
  }
  function cloneEnabled(values,names){
    const packages=Array.isArray(names)?names:slots;
    const result=packages.slice(0,10).map(value=>Boolean(normalizeSlot(value)));
    while(result.length<10) result.push(false);
    if(!Array.isArray(values)) return result;
    values.slice(0,10).forEach((value,index)=>{
      if(value===true || value===1 || value==='1' || value==='true') result[index]=true;
      else if(value===false || value===0 || value==='0' || value==='false') result[index]=false;
    });
    return result;
  }
  function isValidPackage(value){return value.length<64 && /^[A-Za-z][A-Za-z0-9_.]*\.[A-Za-z0-9_.]+$/.test(value);}

  function loadLocal(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_STORAGE_KEY);
      if(!raw) return;
      const data=JSON.parse(raw);
      if(data&&Array.isArray(data.packages)){
        slots=cloneSlots(data.packages);
        slotEnabled=cloneEnabled(data.enabled,slots);
      }
      mode=data&&data.mode==='global'?'global':'whitelist';
    }catch(error){}
  }
  function saveLocal(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:5,mode,packages:slots,enabled:slotEnabled}));}catch(error){}
  }
  function setNotice(text,kind,sticky){
    const toast=$('toast');
    if(toastTimer) clearTimeout(toastTimer);
    toast.className='toast show'+(kind?' '+kind:'');
    toast.textContent=text;
    if(!sticky) toastTimer=setTimeout(()=>{toast.className='toast';},kind==='err'?4200:2200);
  }
  function hideCommand(){ $('cmdPanel').hidden=true; }

  function renderMode(){
    const global=mode==='global';
    $('globalMode').checked=global;
    $('globalMode').disabled=!deviceConfigReady||applyBusy;
    $('modeValue').textContent=deviceConfigReady?(global?'开启 · 全局':'关闭 · 白名单'):(deviceConfigStatus==='error'?'读取失败':'正在读取');
    $('reset').disabled=!deviceConfigReady;
  }
  function updateCount(){
    let active=0;
    slots.forEach((value,index)=>{if(slotEnabled[index]&&normalizeSlot(value)) active++;});
    $('count').textContent=active+' / 10';
  }
  function refreshValidation(){
    const values=slots.map(normalizeSlot);
    const counts={};
    values.forEach((value,index)=>{if(value&&slotEnabled[index]) counts[value]=(counts[value]||0)+1;});
    document.querySelectorAll('.slot-input').forEach((input,index)=>{
      const value=normalizeSlot(input.value);
      const invalid=Boolean(value)&&!isValidPackage(value);
      const duplicate=Boolean(value)&&slotEnabled[index]&&counts[value]>1;
      input.classList.toggle('invalid',invalid);
      input.classList.toggle('dup',!invalid&&duplicate);
    });
  }
  function renderSlots(){
    slots=cloneSlots(slots);
    slotEnabled=cloneEnabled(slotEnabled,slots);
    const root=$('slots');
    root.innerHTML='';
    slots.forEach((value,index)=>{
      const row=document.createElement('div');
      row.className='slot';
      const number=document.createElement('span');
      number.className='slot-num';
      number.textContent=String(index+1).padStart(2,'0');
      const wrap=document.createElement('div');
      wrap.className='slot-wrap';
      const input=document.createElement('input');
      input.className='slot-input'+(index<6?' official':'');
      input.value=value;
      input.placeholder=LABELS[index];
      input.title=LABELS[index];
      input.autocomplete='off';
      input.spellcheck=false;
      input.maxLength=63;
      input.disabled=!deviceConfigReady;
      let committed=value;
      const toggle=document.createElement('input');
      input.addEventListener('input',()=>{
        slots[index]=normalizeSlot(input.value);
        if(!slots[index]){
          slotEnabled[index]=false;
          toggle.checked=false;
        }
        toggle.disabled=!slots[index];
        updateCount();
        refreshValidation();
        hideCommand();
      });
      const commitInput=()=>{
        const next=normalizeSlot(input.value);
        if(next===committed) return;
        committed=next;
        slots[index]=next;
        if(!next){slotEnabled[index]=false;toggle.checked=false;toggle.disabled=true;}
        else toggle.disabled=false;
        configRevision++;
        saveLocal();
        updateCount();
        refreshValidation();
        requestApply('包名已更新',true);
      };
      input.addEventListener('change',commitInput);
      input.addEventListener('blur',commitInput);
      input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();input.blur();}});
      const toggleLabel=document.createElement('label');
      toggleLabel.className='switch slot-switch';
      toggleLabel.title='启用 '+LABELS[index];
      toggle.type='checkbox';
      toggle.setAttribute('role','switch');
      toggle.setAttribute('aria-label',LABELS[index]+'开关');
      toggle.checked=Boolean(slotEnabled[index]&&value);
      toggle.disabled=!deviceConfigReady||!value;
      toggle.addEventListener('change',()=>{
        const current=normalizeSlot(input.value);
        if(!current){toggle.checked=false;slotEnabled[index]=false;return;}
        if(toggle.checked&&!isValidPackage(current)){
          toggle.checked=false;slotEnabled[index]=false;refreshValidation();setNotice('请先填写有效包名','err');return;
        }
        if(toggle.checked&&slotEnabled.some((enabled,other)=>other!==index&&enabled&&normalizeSlot(slots[other])===current)){
          toggle.checked=false;slotEnabled[index]=false;refreshValidation();setNotice('启用槽位不能重复','err');return;
        }
        slotEnabled[index]=toggle.checked;
        configRevision++;
        saveLocal();
        updateCount();
        refreshValidation();
        hideCommand();
        requestApply('槽位 '+String(index+1)+' 已更新',true);
      });
      const track=document.createElement('span');
      track.className='track';
      toggleLabel.append(toggle,track);
      wrap.appendChild(input);
      if(index<6){
        const tag=document.createElement('span');
        tag.className='slot-tag';
        tag.textContent='官';
        wrap.appendChild(tag);
      }
      row.append(number,wrap,toggleLabel);
      root.appendChild(row);
    });
    updateCount();
    refreshValidation();
  }
  function render(){renderMode();renderSlots();}

  function shellQuote(value){return "'"+String(value).replace(/'/g,"'\"'\"'")+"'";}
  function snapshotConfig(){
    const packages=cloneSlots(slots);
    return {mode:mode==='global'?'global':'whitelist',packages,enabled:cloneEnabled(slotEnabled,packages),generation:String(Date.now())};
  }
  function snapshotKey(data){return JSON.stringify({mode:data.mode,packages:data.packages,enabled:data.enabled});}
  function validationMessage(data){
    const seen=new Set();
    for(let index=0;index<10;index++){
      const value=normalizeSlot(data.packages[index]);
      if(!data.enabled[index]||!value) continue;
      if(!isValidPackage(value)) return '第 '+String(index+1)+' 槽包名无效';
      if(seen.has(value)) return '启用槽位不能重复';
      seen.add(value);
    }
    return '';
  }

  function buildWritePackagesCmd(snapshot,readable){
    const data=snapshot||snapshotConfig();
    const values=data.packages.slice(0,10).map(normalizeSlot);
    const states=data.enabled.slice(0,10).map(value=>value?'1':'0');
    while(values.length<10) values.push('');
    while(states.length<10) states.push('0');
    const names=values.map(shellQuote).join(' ');
    const flags=states.map(shellQuote).join(' ');
    const lines=[
      'umask 077;',
      'cfg=/data/adb/modules/a2h_hook/config; cfg_lock=/data/local/tmp/a2h_config.lock;',
      'mkdir -p "$cfg" /data/local/tmp || exit 74;',
      'tag=$$; pkg_tmp="$cfg/.packages.$tag"; state_tmp="$cfg/.package_states.$tag"; gen_tmp="$cfg/.generation.$tag"; pkg_old="$cfg/.packages.old.$tag"; state_old="$cfg/.package_states.old.$tag"; gen_old="$cfg/.generation.old.$tag"; cfg_token=; cfg_backed_up=0; cfg_committed=0; pkg_had=0; state_had=0; gen_had=0;',
      'cfg_proc_start() { cfg_pid=$1; case "$cfg_pid" in \'\'|*[!0-9]*) return 1 ;; esac; cfg_stat=$(cat "/proc/$cfg_pid/stat" 2>/dev/null) || return 1; cfg_tail=${cfg_stat##*) }; [ "$cfg_tail" != "$cfg_stat" ] || return 1; set -- $cfg_tail; [ "$#" -ge 20 ] || return 1; shift 19; case "$1" in \'\'|*[!0-9]*) return 1 ;; esac; printf \'%s\\n\' "$1"; };',
      'cfg_lock_alive() { cfg_owner=$(cat "$cfg_lock/pid" 2>/dev/null) || return 1; set -- $cfg_owner; case "$#" in 1) cfg_pid=$1; case "$cfg_pid" in \'\'|*[!0-9]*) return 1 ;; esac; kill -0 "$cfg_pid" 2>/dev/null || return 1; grep -a -F -q \'a2h_apply\' "/proc/$cfg_pid/cmdline" 2>/dev/null || grep -a -F -q \'a2h_config.lock\' "/proc/$cfg_pid/cmdline" 2>/dev/null ;; 2) cfg_pid=$1; cfg_saved_start=$2; case "$cfg_pid:$cfg_saved_start" in *[!0-9:]*) return 1 ;; esac; cfg_live_start=$(cfg_proc_start "$cfg_pid") || return 1; [ "$cfg_live_start" = "$cfg_saved_start" ] ;; *) return 1 ;; esac; };',
      'cfg_cleanup() { rm -f "$pkg_tmp" "$state_tmp" "$gen_tmp" "$pkg_old" "$state_old" "$gen_old" 2>/dev/null; };',
      'cfg_release() { cfg_owner=$(cat "$cfg_lock/pid" 2>/dev/null); [ "$cfg_owner" = "$cfg_token" ] || return 1; rm -f "$cfg_lock/pid" 2>/dev/null || return 1; rmdir "$cfg_lock" 2>/dev/null; };',
      'cfg_restore_one() { cfg_restore_dest=$1; cfg_restore_old=$2; cfg_restore_had=$3; if [ "$cfg_restore_had" = 1 ]; then cp -f "$cfg_restore_old" "$cfg_restore_dest" 2>/dev/null && chmod 644 "$cfg_restore_dest" 2>/dev/null; else rm -f "$cfg_restore_dest" 2>/dev/null; fi; };',
      'cfg_restore() { [ "$cfg_backed_up" = 1 ] && [ "$cfg_committed" = 0 ] || return 0; cfg_restore_rc=0; cfg_restore_one "$cfg/packages.txt" "$pkg_old" "$pkg_had" || cfg_restore_rc=1; cfg_restore_one "$cfg/package_states" "$state_old" "$state_had" || cfg_restore_rc=1; cfg_restore_one "$cfg/config_generation" "$gen_old" "$gen_had" || cfg_restore_rc=1; return "$cfg_restore_rc"; };',
      'cfg_abort() { cfg_owner=$(cat "$cfg_lock/pid" 2>/dev/null); if [ -n "$cfg_token" ] && [ "$cfg_owner" = "$cfg_token" ]; then cfg_restore || true; rm -f "$cfg_lock/pid" 2>/dev/null; rmdir "$cfg_lock" 2>/dev/null; fi; cfg_cleanup; };',
      'cfg_signal_abort() { trap - 0 1 2 15; cfg_abort; exit 130; };',
      "trap 'cfg_abort' 0; trap 'cfg_signal_abort' 1 2 15;",
      "printf '%s\\n' "+names+' > "$pkg_tmp" || exit 74;',
      "printf '%s\\n' "+flags+' > "$state_tmp" || exit 74;',
      "printf '%s\\n' "+shellQuote(data.generation)+' > "$gen_tmp" || exit 74;',
      'chmod 600 "$pkg_tmp" "$state_tmp" "$gen_tmp" || exit 74;',
      'cfg_wait=0; while ! mkdir "$cfg_lock" 2>/dev/null; do cfg_wait=$((cfg_wait + 1)); [ "$cfg_wait" -le 8 ] || exit 75; if cfg_lock_alive; then sleep 1; continue; fi; cfg_old=$(cat "$cfg_lock/pid" 2>/dev/null || printf \'(missing)\'); sleep 1; cfg_wait=$((cfg_wait + 1)); [ "$cfg_wait" -le 8 ] || exit 75; cfg_lock_alive && continue; cfg_mid=$(cat "$cfg_lock/pid" 2>/dev/null || printf \'(missing)\'); [ "$cfg_old" = "$cfg_mid" ] || continue; sleep 1; cfg_wait=$((cfg_wait + 1)); [ "$cfg_wait" -le 8 ] || exit 75; cfg_lock_alive && continue; cfg_now=$(cat "$cfg_lock/pid" 2>/dev/null || printf \'(missing)\'); [ "$cfg_mid" = "$cfg_now" ] || continue; rm -f "$cfg_lock/pid" 2>/dev/null || exit 75; rmdir "$cfg_lock" 2>/dev/null || true; done;',
      'cfg_start=$(cfg_proc_start "$$") || { rmdir "$cfg_lock" 2>/dev/null; exit 75; }; cfg_token="$$ $cfg_start";',
      'printf \'%s\\n\' "$cfg_token" > "$cfg_lock/pid" 2>/dev/null || { rm -f "$cfg_lock/pid" 2>/dev/null; rmdir "$cfg_lock" 2>/dev/null; exit 75; };',
      'cfg_owner=$(cat "$cfg_lock/pid" 2>/dev/null); [ "$cfg_owner" = "$cfg_token" ] || { rm -f "$cfg_lock/pid" 2>/dev/null; rmdir "$cfg_lock" 2>/dev/null; exit 75; };',
      '[ ! -e "$cfg/packages.txt" ] || [ -f "$cfg/packages.txt" ] || exit 74; [ ! -e "$cfg/package_states" ] || [ -f "$cfg/package_states" ] || exit 74; [ ! -e "$cfg/config_generation" ] || [ -f "$cfg/config_generation" ] || exit 74;',
      'if [ -f "$cfg/packages.txt" ]; then cp -f "$cfg/packages.txt" "$pkg_old" || exit 74; pkg_had=1; fi; if [ -f "$cfg/package_states" ]; then cp -f "$cfg/package_states" "$state_old" || exit 74; state_had=1; fi; if [ -f "$cfg/config_generation" ]; then cp -f "$cfg/config_generation" "$gen_old" || exit 74; gen_had=1; fi; cfg_backed_up=1;',
      'mv -f "$pkg_tmp" "$cfg/packages.txt" || exit 74;',
      'mv -f "$state_tmp" "$cfg/package_states" || exit 74;',
      'mv -f "$gen_tmp" "$cfg/config_generation" || exit 74;',
      'cfg_committed=1; cfg_cleanup; cfg_release || exit 75; trap - 0 1 2 15;'
    ];
    return readable?'(\n  '+lines.join('\n  ')+'\n)':'( '+lines.join(' ')+' )';
  }
  function buildCommand(state,snapshot,writePackages){
    const data=snapshot||snapshotConfig();
    data.mode=state==='enabled'?'global':'whitelist';
    const commands=['# A2HHook apply command'];
    if(writePackages) commands.push(buildWritePackagesCmd(data,true)+' &&');
    commands.push('sh /data/adb/modules/a2h_hook/bin/a2h_apply queue '+shellQuote(state));
    return commands.join('\n');
  }

  function findExecBridge(){
    if(window.ksu&&typeof window.ksu.exec==='function') return {kind:'raw',owner:window.ksu,fn:window.ksu.exec};
    if(window.KSU&&typeof window.KSU.exec==='function') return {kind:'promise',owner:window.KSU,fn:window.KSU.exec};
    if(typeof window.exec==='function') return {kind:'callback',owner:window,fn:window.exec};
    return null;
  }
  function normalizeExecResult(result,depth){
    const level=depth||0;
    if(result==null) return {code:undefined,stdout:'',stderr:''};
    if(typeof result==='number') return {code:result,stdout:'',stderr:''};
    if(typeof result==='string'){
      try{
        const parsed=JSON.parse(result);
        if(parsed!==result) return normalizeExecResult(parsed,level+1);
      }catch(error){}
      return {code:undefined,stdout:result,stderr:''};
    }
    if(typeof result!=='object') return {code:undefined,stdout:String(result),stderr:''};
    let code=result.code??result.exitCode??result.status??result.errno;
    if(result.success===false&&code===undefined) code=1;
    let stdout=result.stdout??result.out??result.output;
    let stderr=result.stderr??result.err??'';
    if(stdout===undefined&&level<3){
      const nested=result.result??result.data??result.value;
      if(nested!==undefined&&nested!==result){
        const normalized=normalizeExecResult(nested,level+1);
        if(code===undefined) code=normalized.code;
        stdout=normalized.stdout;
        if(!stderr) stderr=normalized.stderr;
      }
    }
    if(stdout===undefined&&result.message!==undefined) stdout=result.message;
    return {code:code===undefined?undefined:Number(code),stdout:String(stdout??''),stderr:String(stderr??'')};
  }
  function invokeRawBridge(bridge,command,timeoutMs){
    return new Promise((resolve,reject)=>{
      let settled=false;
      const callbackName='__a2h_exec_'+Date.now()+'_'+(++execSerial);
      const cleanup=()=>{clearTimeout(timer);try{delete window[callbackName];}catch(error){window[callbackName]=undefined;}};
      const finish=value=>{if(!settled){settled=true;cleanup();resolve(value);}};
      const fail=error=>{if(!settled){settled=true;cleanup();reject(error);}};
      const accept=returned=>{
        if(returned&&typeof returned.then==='function') returned.then(finish,fail);
        else if(returned!==undefined&&returned!==null) finish(returned);
      };
      const timer=setTimeout(()=>fail(new Error('timeout')),timeoutMs||8000);
      window[callbackName]=(errno,stdout,stderr)=>finish({code:errno,stdout,stderr});
      try{
        accept(bridge.fn.call(bridge.owner,command,'{}',callbackName));
      }catch(threeArgError){
        try{
          accept(bridge.fn.call(bridge.owner,command,callbackName));
        }catch(twoArgError){
          try{accept(bridge.fn.call(bridge.owner,command));}
          catch(oneArgError){fail(oneArgError);}
        }
      }
    });
  }
  function invokeGenericBridge(bridge,command,timeoutMs){
    return new Promise((resolve,reject)=>{
      let settled=false;
      const timer=setTimeout(()=>fail(new Error('timeout')),timeoutMs||8000);
      const finish=value=>{if(!settled){settled=true;clearTimeout(timer);resolve(value);}};
      const fail=error=>{if(!settled){settled=true;clearTimeout(timer);reject(error);}};
      const callback=(...args)=>args.length<=1?finish(args[0]):finish({code:args[0],stdout:args[1],stderr:args[2]});
      try{
        const returned=bridge.kind==='callback'?
          bridge.fn.call(bridge.owner,command,callback):
          bridge.fn.call(bridge.owner,command,{});
        if(returned&&typeof returned.then==='function') returned.then(finish,fail);
        else if(returned!==undefined&&returned!==null) finish(returned);
        else if(bridge.kind==='promise') fail(new Error('missing-exec-result'));
      }catch(error){fail(error);}
    });
  }
  async function execRoot(command,timeoutMs){
    const bridge=findExecBridge();
    if(!bridge) throw new Error('no-exec');
    const rcMarker='__A2H_EXEC_RC_'+Date.now()+'_'+(++execSerial)+'__';
    const wrapped='( '+command+'\n); a2h_exec_rc=$?; printf \'\\n'+rcMarker+'%s\\n\' "$a2h_exec_rc"; exit 0';
    const raw=bridge.kind==='raw'?await invokeRawBridge(bridge,wrapped,timeoutMs):await invokeGenericBridge(bridge,wrapped,timeoutMs);
    const result=normalizeExecResult(raw);
    const markerAt=result.stdout.lastIndexOf(rcMarker);
    if(markerAt<0){
      if(result.code!==undefined&&result.code!==0) throw new Error('exit '+result.code);
      throw new Error('missing-exec-status');
    }
    const rcMatch=result.stdout.slice(markerAt+rcMarker.length).match(/^(-?[0-9]+)/);
    if(!rcMatch) throw new Error('invalid-exec-status');
    const code=Number(rcMatch[1]);
    const stdout=result.stdout.slice(0,markerAt).replace(/\r?\n$/,'');
    if(code!==0) throw new Error('exit '+code+(result.stderr?': '+result.stderr:''));
    return {code,stdout,stderr:result.stderr};
  }
  function extractStdout(result){
    return normalizeExecResult(result).stdout;
  }

  async function openSystemLink(event){
    const link=event.currentTarget;
    const fallback=link.href;
    const uri=link.dataset.intentUri||fallback;
    event.preventDefault();
    try{
      await execRoot('am start --user 0 -a android.intent.action.VIEW -d '+shellQuote(uri),3500);
    }catch(error){
      console&&console.warn&&console.warn(error);
      const opened=window.open(fallback,'_blank','noopener,noreferrer');
      if(!opened) window.location.href=fallback;
    }
  }

  function requestApply(reason,writePackages){
    if(!deviceConfigReady){setNotice('正在读取设备配置','warn');return;}
    applyPending=true;
    packageWritePending=packageWritePending||Boolean(writePackages);
    applyReason=reason||'配置已更新';
    drainApply();
  }
  async function drainApply(){
    if(applyBusy) return;
    applyBusy=true;
    renderMode();
    try{
      while(applyPending){
        applyPending=false;
        const writePackages=packageWritePending;
        packageWritePending=false;
        const data=snapshotConfig();
        const error=validationMessage(data);
        if(error){refreshValidation();setNotice(error,'err');continue;}
        const key=snapshotKey(data);
        if(key===lastAppliedKey&&!writePackages){saveLocal();continue;}
        const state=data.mode==='global'?'enabled':'disabled';
        setNotice('正在保存：'+applyReason,'',true);
        try{
          const command=(writePackages ? buildWritePackagesCmd(data)+' && ' : '')+
            'sh /data/adb/modules/a2h_hook/bin/a2h_apply queue '+shellQuote(state)+' && '+
            buildReadDeviceCommand(writePackages);
          const text=extractStdout(await execRoot(command,15000));
          verifyDeviceConfig(text,data,writePackages);
          lastAppliedKey=key;
          if(snapshotKey(snapshotConfig())===key){
            saveLocal();
            hideCommand();
            setNotice('已保存，正在后台应用','ok');
          }
        }catch(error){
          console&&console.warn&&console.warn(error);
          packageWritePending=packageWritePending||writePackages;
          if(applyPending||snapshotKey(snapshotConfig())!==key){
            setNotice('上一项保存失败，正在处理最新配置','warn');
            continue;
          }
          $('cmdText').textContent=buildCommand(state,data,writePackages);
          $('cmdPanel').hidden=false;
          setNotice('保存校验失败，正在恢复设备状态','warn',true);
          const restored=await loadDeviceConfig({preserveNotice:true});
          packageWritePending=false;
          setNotice(restored?'保存失败，已恢复设备状态':'保存失败，设备状态读取失败','err');
        }
      }
    }finally{
      applyBusy=false;
      renderMode();
      if(applyPending) drainApply();
    }
  }

  function parseDeviceSection(text,startMarker,endMarker){
    const start=text.indexOf(startMarker);
    if(start<0) return null;
    const from=start+startMarker.length;
    const end=endMarker?text.indexOf(endMarker,from):-1;
    if(endMarker&&end<0) return null;
    let value=end<0?text.slice(from):text.slice(from,end);
    if(value.startsWith('\r\n')) value=value.slice(2);
    else if(value.startsWith('\n')) value=value.slice(1);
    if(value.endsWith('\n')) value=value.slice(0,-1);
    if(value.endsWith('\r')) value=value.slice(0,-1);
    return value;
  }
  function buildReadDeviceCommand(includePackages){
    const lines=[
      "printf '%s\\n' "+shellQuote(DEVICE_MARKERS.state),
      'cat /data/adb/modules/a2h_hook/config/state 2>/dev/null || exit 2'
    ];
    if(includePackages){
      lines.push(
        "printf '%s\\n' "+shellQuote(DEVICE_MARKERS.packages),
        'cat /data/adb/modules/a2h_hook/config/packages.txt 2>/dev/null || exit 2',
        "printf '%s\\n' "+shellQuote(DEVICE_MARKERS.states),
        'cat /data/adb/modules/a2h_hook/config/package_states 2>/dev/null || true'
      );
    }
    lines.push("printf '%s\\n' "+shellQuote(DEVICE_MARKERS.end));
    return lines.join('; ');
  }
  function parseDeviceMode(text,endMarker){
    const stateText=parseDeviceSection(text,DEVICE_MARKERS.state,endMarker||DEVICE_MARKERS.end);
    if(stateText===null) throw new Error('missing-device-state');
    const state=stateText.trim();
    if(state!=='enabled'&&state!=='disabled') throw new Error('invalid-device-state');
    return state==='enabled'?'global':'whitelist';
  }
  function parseDeviceConfig(text){
    if(text.indexOf(DEVICE_MARKERS.end)<0) throw new Error('incomplete-device-config');
    const packageText=parseDeviceSection(text,DEVICE_MARKERS.packages,DEVICE_MARKERS.states);
    const stateText=parseDeviceSection(text,DEVICE_MARKERS.states,DEVICE_MARKERS.end);
    if(packageText===null||stateText===null) throw new Error('invalid-device-config');
    const packages=Array(10).fill('');
    packageText.replace(/\r/g,'').split('\n').slice(0,10).forEach((line,index)=>{packages[index]=normalizeSlot(line);});
    const rawStates=stateText.replace(/\r/g,'').split('\n').map(value=>value.trim());
    return {mode:parseDeviceMode(text,DEVICE_MARKERS.packages),packages,enabled:cloneEnabled(rawStates,packages)};
  }
  function verifyDeviceConfig(text,expected,includePackages){
    const actual=includePackages?parseDeviceConfig(text):{mode:parseDeviceMode(text)};
    if(actual.mode!==expected.mode) throw new Error('device-mode-mismatch');
    if(includePackages){
      const expectedPackages=cloneSlots(expected.packages);
      const expectedEnabled=cloneEnabled(expected.enabled,expectedPackages);
      for(let index=0;index<10;index++){
        if(actual.packages[index]!==expectedPackages[index]||actual.enabled[index]!==expectedEnabled[index]) throw new Error('device-config-mismatch');
      }
    }
    return actual;
  }
  async function loadDeviceConfig(options){
    const settings=options||{};
    deviceConfigReady=false;
    deviceConfigStatus='loading';
    renderMode();
    renderSlots();
    const startRevision=configRevision;
    try{
      const text=extractStdout(await execRoot(buildReadDeviceCommand(true),6000));
      if(configRevision!==startRevision){
        if(!settings.preserveNotice) setNotice('保留当前编辑内容','warn');
        return false;
      }
      const data=parseDeviceConfig(text);
      mode=data.mode;
      slots=data.packages;
      slotEnabled=data.enabled;
      deviceConfigReady=true;
      deviceConfigStatus='ready';
      configRevision++;
      render();
      saveLocal();
      lastAppliedKey=snapshotKey(snapshotConfig());
      $('retry').hidden=true;
      return true;
    }catch(error){
      console&&console.warn&&console.warn(error);
      deviceConfigReady=false;
      deviceConfigStatus='error';
      renderMode();
      renderSlots();
      $('retry').hidden=false;
      if(!settings.preserveNotice) setNotice('设备配置读取失败','warn');
      return false;
    }
  }

  $('globalMode').addEventListener('change',event=>{
    if(!deviceConfigReady){event.target.checked=mode==='global';setNotice('设备配置尚未载入','warn');return;}
    mode=event.target.checked?'global':'whitelist';
    configRevision++;
    renderMode();
    requestApply(mode==='global'?'全局模式已开启':'白名单模式已开启',false);
  });
  $('theme').addEventListener('click',()=>{
    const root=document.documentElement;
    root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
    $('theme').textContent=root.dataset.theme==='dark'?'☾':'☼';
    try{localStorage.setItem('a2h_theme',root.dataset.theme);}catch(error){}
  });
  $('reset').addEventListener('click',()=>{
    if(!deviceConfigReady){setNotice('设备配置尚未载入','warn');return;}
    slots=DEFAULTS.slice();
    slotEnabled=[true,true,true,true,true,true,false,false,false,false];
    configRevision++;
    renderSlots();
    saveLocal();
    requestApply('已恢复官方默认',true);
  });
  $('retry').addEventListener('click',()=>{
    $('retry').hidden=true;
    setNotice('正在重新读取配置','',true);
    loadDeviceConfig();
  });
  $('cmdClose').addEventListener('click',hideCommand);
  $('cmdPanel').addEventListener('click',event=>{if(event.target===$('cmdPanel')) hideCommand();});
  $('copy').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText($('cmdText').textContent);setNotice('命令已复制','ok');hideCommand();}
    catch(error){setNotice('请长按命令手动复制','warn');}
  });
  document.querySelectorAll('.social-link').forEach(link=>link.addEventListener('click',openSystemLink));

  try{
    const theme=localStorage.getItem('a2h_theme');
    if(theme==='dark') document.documentElement.dataset.theme='dark';
    $('theme').textContent=document.documentElement.dataset.theme==='dark'?'☾':'☼';
  }catch(error){}
  loadLocal();
  render();
  loadDeviceConfig();
})();
</script>
</body>
